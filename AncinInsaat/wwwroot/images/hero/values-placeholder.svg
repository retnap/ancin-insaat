<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <title>Ancın İnşaat — Değerlerimiz, yer tutucu banner görseli</title>
  <rect width="1600" height="900" fill="#F0EEEB" />

  <!-- Abstract "pillars" line-art — distinct from About Us's varied-height
       skyline: five evenly spaced, equal-height columns under one shared
       lintel, reading as "foundational pillars" for a Values page rather
       than a cityscape. Placeholder only — replace with real banner
       photography before launch (see wwwroot/images/hero). -->
  <g fill="none" stroke="#55504D" stroke-width="2.5">
    <line x1="260" y1="300" x2="1340" y2="300" />

    <rect x="260" y="300" width="120" height="430" />
    <line x1="300" y1="300" x2="300" y2="730" />
    <line x1="340" y1="300" x2="340" y2="730" />

    <rect x="530" y="300" width="120" height="430" />
    <line x1="570" y1="300" x2="570" y2="730" />
    <line x1="610" y1="300" x2="610" y2="730" />

    <rect x="740" y="300" width="120" height="430" />
    <line x1="780" y1="300" x2="780" y2="730" />
    <line x1="820" y1="300" x2="820" y2="730" />

    <rect x="950" y="300" width="120" height="430" />
    <line x1="990" y1="300" x2="990" y2="730" />
    <line x1="1030" y1="300" x2="1030" y2="730" />

    <rect x="1220" y="300" width="120" height="430" />
    <line x1="1260" y1="300" x2="1260" y2="730" />
    <line x1="1300" y1="300" x2="1300" y2="730" />
  </g>

  <line x1="140" y1="730" x2="1460" y2="730" stroke="#9E2B25" stroke-width="4" />
</svg>
