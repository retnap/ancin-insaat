<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <title>Ancın İnşaat — İnsan Kaynakları Politikası, yer tutucu banner görseli</title>
  <rect width="1600" height="900" fill="#F0EEEB" />

  <!-- Abstract "campus" line-art — a taller central entrance block flanked
       by two symmetric lower wings, reading as a workplace/headquarters
       composition distinct from About Us's varied skyline and Values'
       equal-height pillars. Placeholder only — replace with real banner
       photography before launch (see wwwroot/images/hero). -->
  <g fill="none" stroke="#55504D" stroke-width="2.5">
    <!-- Left wing -->
    <rect x="180" y="450" width="380" height="300" />
    <line x1="180" y1="510" x2="560" y2="510" />
    <line x1="180" y1="570" x2="560" y2="570" />
    <line x1="180" y1="630" x2="560" y2="630" />
    <line x1="180" y1="690" x2="560" y2="690" />
    <line x1="260" y1="450" x2="260" y2="750" />
    <line x1="340" y1="450" x2="340" y2="750" />
    <line x1="420" y1="450" x2="420" y2="750" />
    <line x1="500" y1="450" x2="500" y2="750" />

    <!-- Central entrance block -->
    <rect x="610" y="250" width="380" height="500" />
    <line x1="610" y1="330" x2="990" y2="330" />
    <line x1="610" y1="410" x2="990" y2="410" />
    <line x1="610" y1="490" x2="990" y2="490" />
    <line x1="610" y1="570" x2="990" y2="570" />
    <line x1="690" y1="250" x2="690" y2="650" />
    <line x1="770" y1="250" x2="770" y2="650" />
    <line x1="830" y1="250" x2="830" y2="650" />
    <line x1="910" y1="250" x2="910" y2="650" />
    <rect x="750" y="650" width="100" height="100" />
    <line x1="800" y1="200" x2="800" y2="250" />
    <line x1="700" y1="200" x2="900" y2="200" />

    <!-- Right wing -->
    <rect x="1040" y="450" width="380" height="300" />
    <line x1="1040" y1="510" x2="1420" y2="510" />
    <line x1="1040" y1="570" x2="1420" y2="570" />
    <line x1="1040" y1="630" x2="1420" y2="630" />
    <line x1="1040" y1="690" x2="1420" y2="690" />
    <line x1="1100" y1="450" x2="1100" y2="750" />
    <line x1="1180" y1="450" x2="1180" y2="750" />
    <line x1="1260" y1="450" x2="1260" y2="750" />
    <line x1="1340" y1="450" x2="1340" y2="750" />
  </g>

  <line x1="120" y1="750" x2="1480" y2="750" stroke="#9E2B25" stroke-width="4" />
</svg>
